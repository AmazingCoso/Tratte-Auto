<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pianificatore Viaggio</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f4f9; padding: 15px; margin: 0; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; font-size: 20px; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input[type="text"] { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        button { background-color: #3498db; color: white; border: none; padding: 12px 15px; border-radius: 6px; cursor: pointer; font-size: 15px; }
        .btn-success { background-color: #2ecc71; width: 100%; font-size: 16px; font-weight: bold; margin-top: 15px; padding: 14px;}
        .btn-danger { background-color: #e74c3c; padding: 12px; }
        .waypoint-row { display: flex; gap: 8px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Pianificatore Viaggio 🗺️</h2>
    
    <div class="form-group">
        <label>Partenza:</label>
        <div style="display: flex; gap: 8px;">
            <input type="text" id="origin" placeholder="Indirizzo o coordinate GPS">
            <button type="button" onclick="ottieniGPS()">GPS 📍</button>
        </div>
    </div>

    <div class="form-group">
        <label>Tappe Intermedie:</label>
        <div id="waypoints-container"></div>
        <button type="button" onclick="aggiungiTappa()" style="background-color: #9b59b6; width: 100%; margin-top: 5px;">+ Aggiungi Tappa</button>
    </div>

    <div class="form-group">
        <label>Destinazione Finale:</label>
        <input type="text" id="destination" placeholder="Es. Indirizzo di arrivo">
    </div>

    <button type="button" class="btn-success" onclick="apriGoogleMaps()">Apri su Google Maps 🚗</button>
</div>

<script>
    function ottieniGPS() {
        const originInput = document.getElementById('origin');
        if (navigator.geolocation) {
            originInput.value = "Rilevamento in corso...";
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    originInput.value = `${position.coords.latitude},${position.coords.longitude}`;
                },
                (error) => {
                    alert("Impossibile rilevare la posizione GPS. Assicurati di aver concesso i permessi.");
                    originInput.value = "";
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        } else {
            alert("Geolocalizzazione non supportata.");
        }
    }

    function aggiungiTappa() {
        const container = document.getElementById('waypoints-container');
        const row = document.createElement('div');
        row.className = 'waypoint-row';
        row.innerHTML = `<input type="text" class="waypoint-input" placeholder="Indirizzo tappa"><button type="button" class="btn-danger" onclick="this.parentElement.remove()">X</button>`;
        container.appendChild(row);
    }

    function apriGoogleMaps() {
        const origin = encodeURIComponent(document.getElementById('origin').value);
        const destination = encodeURIComponent(document.getElementById('destination').value);

        if (!origin || !destination) {
            alert("Inserisci almeno Partenza e Destinazione!");
            return;
        }

        let waypointsArray = [];
        document.querySelectorAll('.waypoint-input').forEach(input => {
            if (input.value.trim() !== "") waypointsArray.push(input.value.trim());
        });

        let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}`;
        if (waypointsArray.length > 0) {
            url += `&waypoints=${waypointsArray.map(w => encodeURIComponent(w)).join('|')}`;
        }

        window.open(url, '_blank');
    }
</script>

</body>
</html>
